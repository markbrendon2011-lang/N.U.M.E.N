<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Project N.U.M.E.N</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#05030a;--card:rgba(16,22,30,.72);--ink:#eaf2f7;--mute:#7d8c99;--line:rgba(167,123,255,.22);--au:#a77bff;--arc:#ff4d8d;--chip:rgba(255,255,255,.05);--sheet:#0a0f15;
--hf:"Orbitron","Eurostile",system-ui,sans-serif;--bf:"Rajdhani","Segoe UI",system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,#1c0b3a 0,transparent 60%),radial-gradient(600px 400px at 100% 100%,#2e0a1e 0,transparent 60%),var(--bg);color:var(--ink);font-family:var(--bf);font-weight:600;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(255,77,141,.035) 1px,transparent 1px) 0 0/100% 4px;pointer-events:none;z-index:50}
body:after{content:"";position:fixed;inset:0;background:linear-gradient(rgba(255,77,141,.04) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,rgba(255,77,141,.04) 1px,transparent 1px) 0 0/36px 36px;pointer-events:none;mask:radial-gradient(circle at 50% 30%,#000,transparent 75%);-webkit-mask:radial-gradient(circle at 50% 30%,#000,transparent 75%);z-index:0}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#030208;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s,transform .8s,visibility .8s}
#intro.out{opacity:0;transform:scale(1.15);visibility:hidden}
.reactor{width:170px;height:170px;filter:drop-shadow(0 0 18px var(--arc));animation:pop 1s both}
.r1{transform-origin:100px 100px;animation:spin 6s linear infinite}.r2{transform-origin:100px 100px;animation:spin 4s linear infinite reverse}.r3{transform-origin:100px 100px;animation:spin 9s linear infinite}
.core{animation:pulse 1.4s ease-in-out infinite;transform-origin:100px 100px}
.bt{font-family:var(--hf);letter-spacing:.4em;font-size:12px;color:var(--au);animation:fade 1s .5s both;text-align:center}
.bt small{display:block;letter-spacing:.3em;color:var(--arc);font-size:10px;margin-top:10px;font-family:var(--bf)}
.pb{width:200px;height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;animation:fade .5s .6s both}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--au),var(--arc));box-shadow:0 0 10px var(--arc);animation:load 2.1s .6s ease-out forwards}
/* app */
.app{position:relative;z-index:1;width:100%;max-width:440px;padding:20px 16px 50px}
.rv{animation:up .8s cubic-bezier(.2,.8,.2,1) both paused}body.ready .rv{animation-play-state:running}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.who small{font-size:11px;letter-spacing:.25em;color:var(--arc);display:block;font-family:var(--hf);font-weight:500}
.who b{font-family:var(--hf);font-size:18px;letter-spacing:.08em;background:linear-gradient(90deg,#efe4ff,var(--au));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--au);font-size:18px;cursor:pointer}
.br{position:relative;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
.br:before,.br:after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--au);pointer-events:none}
.br:before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:18px}
.br:after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:18px}
.hero{padding:22px;overflow:hidden;box-shadow:0 0 50px rgba(255,77,141,.12),inset 0 0 40px rgba(167,123,255,.05)}
.hero:before,.hero:after{z-index:2}
.sweep{position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(transparent,rgba(255,77,141,.12),transparent);animation:sweep 4s 2.8s linear infinite;pointer-events:none}
.hero .l{font-size:12px;letter-spacing:.3em;color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.hero .l:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--arc);box-shadow:0 0 10px var(--arc);animation:pulse 1.4s infinite}
.hero .a{font-family:var(--hf);font-weight:900;font-size:36px;margin:10px 0 18px;background:linear-gradient(180deg,#f3eaff,var(--au) 60%,#5a2fd0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(167,123,255,.35))}
.g{display:flex;align-items:center;gap:18px}
.dw{position:relative;width:108px;height:108px;flex:none}
.dw:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px dashed rgba(255,77,141,.5);animation:spin 14s linear infinite}
.dw svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 6px rgba(255,77,141,.4))}
.leg{flex:1;display:grid;gap:9px;font-size:14px}
.leg div{display:flex;align-items:center;gap:8px}.leg i{width:9px;height:9px;border-radius:2px;box-shadow:0 0 8px currentColor}.leg span{margin-left:auto;font-family:var(--hf);font-size:12px;color:var(--au)}
h2{font-family:var(--hf);font-size:13px;letter-spacing:.3em;font-weight:700;margin:28px 2px 12px;display:flex;justify-content:space-between;align-items:center;color:var(--au);text-transform:uppercase}
h2 small{font-family:var(--bf);letter-spacing:.1em;font-size:12px;color:var(--mute);font-weight:500}
.grid{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;width:100%;color:var(--ink);text-align:left;font:inherit;font-weight:600;transition:transform .2s,box-shadow .3s,border-color .3s;overflow:hidden}
.row:hover{border-color:var(--c);box-shadow:0 0 28px -6px var(--c)}.row:active{transform:scale(.98)}
.ico{width:72px;height:72px;border-radius:14px;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 28%,transparent),rgba(255,255,255,.03) 70%);border:1px solid rgba(255,255,255,.07)}
.ico svg{width:56px;height:56px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));animation:float 4s ease-in-out infinite}
.row .n{flex:1;min-width:0}.row .n b{display:block;font-family:var(--hf);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.row .n span{font-size:13px;color:var(--mute);display:block;margin-top:3px}
.pill{margin-top:9px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.pill i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .6s}
.row .v{font-family:var(--hf);font-weight:700;font-size:14px;color:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.btn{border-radius:12px;padding:15px;font-family:var(--hf);font-weight:700;letter-spacing:.12em;font-size:11px;text-transform:uppercase;cursor:pointer;border:1px solid var(--line);color:var(--ink);background:var(--chip)}
.gold{background:linear-gradient(135deg,#c9a8ff,#6a3df0);color:#fff;border:0;box-shadow:0 0 24px rgba(167,123,255,.35)}
.ov{position:fixed;inset:0;background:rgba(0,3,6,.7);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:60}
.ov.on{display:flex}
.sheet{background:var(--sheet);border:1px solid var(--line);border-bottom:0;width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:sl .35s;box-shadow:0 -10px 50px rgba(255,77,141,.12)}
.sh{display:flex;gap:14px;align-items:center;margin-bottom:10px}.sh .ico{width:62px;height:62px}.sh .ico svg{width:46px;height:46px}
.sheet h3{margin:0;font-family:var(--hf);font-size:16px;letter-spacing:.15em;text-transform:uppercase;color:var(--au)}.sheet p{margin:0 0 6px;color:var(--mute);font-size:14px}
label{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--arc);display:block;margin:12px 0 5px}
input{width:100%;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;font-family:var(--hf);font-size:16px;outline:0}
input:focus{border-color:var(--arc);box-shadow:0 0 14px rgba(255,77,141,.3)}
.step{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.step .d{flex:1;font-family:var(--hf);font-size:14px}.step .d small{color:var(--mute);font-family:var(--bf);margin-left:6px}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--au);font-size:19px;cursor:pointer}
.step input{width:66px;text-align:center;padding:8px;font-size:14px}
.tot{display:flex;justify-content:space-between;margin:16px 0 12px;font-family:var(--hf);font-size:15px;color:var(--au)}
#lock{position:fixed;inset:0;z-index:90;background:radial-gradient(600px 420px at 50% 15%,#1c0b3a,#030208);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;transition:opacity .9s,transform .9s,visibility .9s}
#lock.on{display:flex;animation:fade .8s both}#lock.out{opacity:0;transform:scale(1.25);visibility:hidden}
.lk{width:96px;height:96px;filter:drop-shadow(0 0 14px var(--arc));animation:pulse 2.4s infinite}.lk.ok{animation:unl 1s both}
.lt{font-family:var(--hf);font-size:12px;letter-spacing:.35em;color:var(--au);text-align:center;min-height:16px}
.dots{display:flex;gap:16px;margin:4px 0 8px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--au);transition:.2s}
.dots i.f{background:var(--arc);border-color:var(--arc);box-shadow:0 0 14px var(--arc)}
.dots.bad{animation:shake .5s}.dots.bad i{border-color:#ff3b3b;background:#ff3b3b;box-shadow:0 0 14px #ff3b3b}
.dots.ok i{background:#5dffa0;border-color:#5dffa0;box-shadow:0 0 16px #5dffa0}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-family:var(--hf);font-size:20px;cursor:pointer;transition:.15s}
.pad button:active{background:var(--au);color:#fff;transform:scale(.92);box-shadow:0 0 20px var(--au)}
#kick{position:fixed;inset:0;z-index:200;background:#0a0000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#ff3b3b;font-family:var(--hf);padding:20px}
#kick.on{display:flex;animation:flash .5s 4}#kick h1{font-size:18px;letter-spacing:.25em;margin:0}#kick p{font-size:11px;color:#ff9a9a;letter-spacing:.2em;margin:0}#kick .ct{font-size:34px;margin-top:10px}
@keyframes flash{50%{background:#4a0000}}
#mute{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(10,6,20,.8);color:var(--au);font-size:18px;cursor:pointer}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}@keyframes unl{50%{transform:scale(1.4);filter:drop-shadow(0 0 40px #5dffa0)}}
@media (max-height:700px){.pad{grid-template-columns:repeat(3,58px);gap:10px}.pad button{height:58px;font-size:17px}.lk{width:64px;height:64px}}
.owr{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;width:100%;color:var(--ink);text-align:left;font:inherit;font-weight:600;transition:.2s;--c:#ffb36b}
.owr:hover{border-color:var(--c);box-shadow:0 0 24px -6px var(--c)}
.ini{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--hf);font-size:15px;background:linear-gradient(135deg,var(--au),var(--arc));color:#fff;flex:none}
.owr .n{flex:1;min-width:0}.owr .n b{display:block;font-size:16px}.owr .n span{font-size:13px;color:var(--mute)}
.owr .v{font-family:var(--hf);font-size:14px;color:#ffb36b}
.empty{padding:18px;text-align:center;color:var(--mute);font-size:14px}.ow{margin-top:14px;font-size:13px;color:#ffb36b;letter-spacing:.08em}
.rec{background:linear-gradient(135deg,#5dffa0,#1d9f5a);color:#06260f;border:0}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(6px)}}@keyframes sl{from{transform:translateY(60px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45;transform:scale(.94)}}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-90deg)}}@keyframes fade{from{opacity:0}}
@keyframes load{to{width:100%}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes blink{0%,86%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}}@keyframes glow{from{opacity:0}}
.tri{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.5s .3s ease-out forwards}
.eye{transform-origin:100px 106px;animation:glow .8s 1.4s both,blink 3.2s 2.2s infinite}.rays{animation:glow 1s 1.6s both,pulse 1.4s 2.6s infinite}@keyframes sweep{to{top:110%}}@keyframes float{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>
<div id="intro">
  <svg class="reactor" viewBox="0 0 200 200"><g fill="none" stroke="#ff4d8d">
    <circle class="r1" cx="100" cy="100" r="92" stroke-width="2" stroke-dasharray="40 12 4 12"/>
    <circle class="r2" cx="100" cy="100" r="76" stroke="#a77bff" stroke-width="3" stroke-dasharray="90 20"/>
    <circle class="r3" cx="100" cy="100" r="58" stroke-width="10" stroke-dasharray="8 6" opacity=".7"/></g>
    <g class="core"><polygon class="tri" points="100,54 144,130 56,130" fill="rgba(167,123,255,.12)" stroke="#ffd0e6" stroke-width="3" stroke-linejoin="round"/></g>
    <g class="eye"><path d="M76 106Q100 84 124 106Q100 128 76 106Z" fill="#12081f" stroke="#ff4d8d" stroke-width="2.5"/><circle cx="100" cy="106" r="8" fill="#ff4d8d"/><circle cx="100" cy="106" r="3.5" fill="#fff"/></g>
    <g stroke="#ff4d8d" stroke-width="2" stroke-linecap="round" class="rays"><path d="M100 40v-8M120 46l4-7M80 46l-4-7M152 100h10M48 100H38"/></g></svg>
  <div class="bt">PROJECT N.U.M.E.N<small>FINANCIAL CORE · INITIALIZING</small></div>

</div>
<button id="mute" title="Voice on/off"></button>
<div id="kick"><div style="font-size:64px">⛔</div><h1>PROTECTION PROTOCOL ENGAGED</h1><p>INTRUDER DETECTED · SESSION TERMINATED</p><div class="ct" id="ct"></div></div>
<div id="lock"><svg class="lk" id="lk" viewBox="0 0 200 200"><polygon points="100,30 175,160 25,160" fill="rgba(167,123,255,.12)" stroke="#ffd0e6" stroke-width="5" stroke-linejoin="round"/><path d="M62 118Q100 78 138 118Q100 158 62 118Z" fill="#12081f" stroke="#ff4d8d" stroke-width="5"/><circle cx="100" cy="118" r="14" fill="#ff4d8d"/><circle cx="100" cy="118" r="6" fill="#fff"/></svg><div class="lt" id="lt">ENTER ACCESS CODE</div><div class="dots" id="dd"></div><div class="pad" id="pad"></div></div>
<div class="app">
  <div class="top rv" style="animation-delay:.1s"><div class="who"><small>WELCOME BACK, OPERATOR</small><b>N.U.M.E.N</b><span id="sy" style="display:block;margin-top:3px;font-size:11px;letter-spacing:.15em;color:var(--mute)">○ LOCAL ONLY</span></div><button class="ib" id="th" title="Replay boot">↻</button></div>
  <div class="hero br rv" style="animation-delay:.25s"><div class="sweep"></div><div class="l">Net worth</div><div class="a" id="total">₹0</div>
    <div class="g"><div class="dw"><svg viewBox="0 0 42 42" id="donut"></svg></div><div class="leg" id="leg"></div></div><div class="ow" id="ow"></div></div>
  <h2 class="rv" style="animation-delay:.4s">Assets <small>Tap to edit</small></h2>

  <div class="acts rv" style="animation-delay:.9s"><button class="btn gold" id="rate">Edit gold</button><button class="btn" id="reset">Wipe data</button></div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
const COINS=[1,2,5,10,20],NOTES=[10,20,50,100,200,500];
const def={gold:0,coins:{},notes:{},fam:0,owed:[]};
let S=JSON.parse(JSON.stringify(def));
try{const r=localStorage.getItem("wallet");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.gold&&typeof S.gold==="object")S.gold=(S.gold.g||0)*(S.gold.rate||0);
let cloud=null,pt;
const save=()=>{try{localStorage.setItem("wallet",JSON.stringify(S))}catch(e){}
  clearTimeout(pt);pt=setTimeout(()=>{if(cloud){setSync("↻ Syncing…");cloud.set(JSON.parse(JSON.stringify(S))).then(()=>setSync("✓ Synced")).catch(()=>setSync("⚠ Sync failed"))}},400)};
const setSync=t=>{const e=document.getElementById("sy");if(e)e.textContent=t};
const inr=n=>"₹"+(Math.round(n*100)/100).toLocaleString("en-IN",{maximumFractionDigits:2});
const sum=o=>Object.entries(o||{}).reduce((a,[d,c])=>a+d*c,0);
const val=()=>({gold:+S.gold||0,coins:sum(S.coins),notes:sum(S.notes),fam:+S.fam||0});
const ART={
gold:`<svg viewBox="0 0 64 64"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#f5b942"/><stop offset="1" stop-color="#b9770e"/></linearGradient></defs><path d="M8 44l8-16h32l8 16z" fill="url(#gg)"/><path d="M16 28l4-8h24l4 8z" fill="#ffe082"/><path d="M8 44h48v6a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2z" fill="#b9770e"/><path d="M22 36h20" stroke="#fff6" stroke-width="2" stroke-linecap="round"/></svg>`,
coins:`<svg viewBox="0 0 64 64"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c6d2ff"/><stop offset="1" stop-color="#3a52d9"/></linearGradient></defs><g fill="url(#cg)" stroke="#1c2a85" stroke-width="1.5"><ellipse cx="24" cy="46" rx="16" ry="6"/><path d="M8 38v8c0 3 7 6 16 6s16-3 16-6v-8"/><ellipse cx="24" cy="38" rx="16" ry="6"/><ellipse cx="38" cy="22" rx="16" ry="6"/><path d="M22 22v8c0 3 7 6 16 6s16-3 16-6v-8"/><ellipse cx="38" cy="22" rx="16" ry="6"/></g><text x="38" y="25" font-size="9" font-weight="700" fill="#0b1250" text-anchor="middle">₹</text></svg>`,
notes:`<svg viewBox="0 0 64 64"><rect x="6" y="16" width="52" height="32" rx="6" fill="#8affb0" stroke="#1d7a45" stroke-width="1.5"/><rect x="11" y="21" width="42" height="22" rx="3" fill="none" stroke="#1d7a45" stroke-dasharray="3 2"/><circle cx="32" cy="32" r="8" fill="#3fcf7a"/><text x="32" y="36" font-size="11" font-weight="700" fill="#06260f" text-anchor="middle">₹</text><circle cx="15" cy="32" r="2.5" fill="#1d7a45"/><circle cx="49" cy="32" r="2.5" fill="#1d7a45"/></svg>`,
fam:`<svg viewBox="0 0 64 64"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ab8"/><stop offset="1" stop-color="#e0306a"/></linearGradient></defs><rect x="5" y="14" width="54" height="36" rx="7" fill="url(#fg)"/><rect x="11" y="23" width="11" height="8" rx="2" fill="#ffe29a"/><circle cx="45" cy="40" r="6" fill="#fff" opacity=".55"/><circle cx="51" cy="40" r="6" fill="#fff" opacity=".35"/><rect x="11" y="40" width="18" height="3" rx="1.5" fill="#fff" opacity=".7"/></svg>`};
const META={gold:["Digital Gold","#f5c04a"],coins:["Coins","#6f8bff"],notes:["Notes","#5dffa0"],fam:["FamPay","#ff6b9a"]};
let shown=0,ready=false,fresh=true,pending=0;
function anim(to){const f=shown,t0=performance.now();(function st(n){const p=Math.min(1,(n-t0)/1400);shown=f+(to-f)*(1-Math.pow(1-p,4));total.textContent=inr(shown);if(p<1)requestAnimationFrame(st)})(t0)}
function render(){
  const v=val(),t=Object.values(v).reduce((a,b)=>a+b,0);
  if(ready)anim(t);else pending=t;
  let off=0;const R=15.9;

  const sub={gold:"Amount bought",coins:Object.values(S.coins).reduce((a,b)=>a+(+b||0),0)+" coins",notes:Object.values(S.notes).reduce((a,b)=>a+(+b||0),0)+" notes",fam:"Wallet balance"};
  list.innerHTML=Object.keys(v).map((k,i)=>`<button class="row br${fresh?" rv":""}" data-k="${k}" style="--c:${META[k][1]};${fresh?`animation-delay:${.55+i*.12}s`:""}"><div class="ico">${ART[k]}</div><div class="n"><b>${META[k][0]}</b><span>${sub[k]}</span><div class="pill"><i style="width:${Math.max(4,t?v[k]/t*100:0)}%"></i></div></div><div class="v">${inr(v[k])}</div></button>`).join("");
  list.querySelectorAll(".row").forEach(b=>b.onclick=()=>open(b.dataset.k));
  renderOwed();
}
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderOwed(){

function openOwed(i){

function open(k){
  let h="";
  if(k==="gold")h=`<p>Total money you've spent buying gold</p><label>Gold bought (₹)</label><input id="g" type="number" min="0" value="${S.gold}">`;
  else if(k==="fam")h=`<p>Current wallet balance</p><label>Balance (₹)</label><input id="f" type="number" min="0" value="${S.fam}">`;
  else{const D=k==="coins"?COINS:NOTES;h=`<p>How many of each do you have?</p>`+D.map(d=>`<div class="step"><div class="d">₹${d}<small>${k==="coins"?"coin":"note"}</small></div><button data-d="${d}" data-s="-1">−</button><input type="number" min="0" data-c="${d}" value="${S[k][d]||0}"><button data-d="${d}" data-s="1">+</button></div>`).join("");}
  h=`<div class="sh"><div class="ico" style="--c:${META[k][1]}">${ART[k]}</div><div><h3>${META[k][0]}</h3></div></div>`+h+`<div class="tot"><span>VALUE</span><span id="sv"></span></div><button class="btn gold" style="width:100%" id="done">Save</button>`;
  sheet.innerHTML=h;ov.classList.add("on");
  const read=()=>{
    if(k==="gold"){S.gold=+g.value||0;sv.textContent=inr(S.gold)}
    else if(k==="fam"){S.fam=+f.value||0;sv.textContent=inr(S.fam)}

  };
  sheet.querySelectorAll("input").forEach(i=>i.oninput=read);
  sheet.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const i=sheet.querySelector(`[data-c="${b.dataset.d}"]`);i.value=Math.max(0,(+i.value||0)+ +b.dataset.s);read()});
  done.onclick=()=>ov.classList.remove("on");
  read();
}
